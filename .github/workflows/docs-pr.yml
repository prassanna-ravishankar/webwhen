# Docs PR checks: install from the lockfile and build the VitePress site, the
# same steps as docs-site/Dockerfile. Catches peer-dependency breaks in
# dependency PRs (e.g. #375's mermaid 12 bump) before they reach the deploy.

name: Docs PR Checks

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs-site/**'
      - '.github/workflows/docs-pr.yml'

jobs:
  build:
    name: VitePress build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: docs-site/package-lock.json

      - name: Install dependencies
        working-directory: ./docs-site
        run: npm ci

      - name: Build docs
        working-directory: ./docs-site
        run: npm run docs:build
